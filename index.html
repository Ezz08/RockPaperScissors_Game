<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.png" type="image/png">
</head>

<body>
    <p class="title">Rock Paper Scissors</p>

    <button class="move-button" data-move="rock">
        <img src="img/rock-emoji.png" class="move-icon">
    </button>

    <button class="move-button" data-move="paper">
        <img src="img/paper-emoji.png" class="move-icon">
    </button>

    <button class="move-button" data-move="scissors">
        <img src="img/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-score-button">Reset Score</button>

    <button class="auto-play">Auto Play</button>

    <script src="js/script.js"></script>
</body>

</html>
